# ruyi docker compose — the database always lives on a real host directory (~/ruyi-docker/);
# deleting/rebuilding the container or upgrading the image loses nothing. This is the default and only recommended posture.
#
#   docker compose up -d --build        # first build + start
#   edit ~/ruyi-docker/config.local.json to fill in the LLM key (a template is auto-generated on first run)
#   docker compose restart              # restart after config changes
#   docker compose --profile dream up -d   # optional: in-container nightly dreaming
#   docker compose pull && docker compose up -d --build   # upgrade the image
#
# Compose is optional: docker build -t ruyi . && docker run -d --name ruyi \
#   -v ~/ruyi-docker:/data -p 127.0.0.1:8899:8899 ruyi serve -h 0.0.0.0

services:
  ruyi:
    build: .
    image: ruyi:latest
    container_name: ruyi
    # the container must bind 0.0.0.0 for the -p port mapping to work; token via -t or the authToken config
    command: ["serve", "-h", "0.0.0.0"]
    ports:
      - "127.0.0.1:8899:8899"
    volumes:
      - ~/ruyi-docker:/data
    restart: unless-stopped

  # optional: nightly dreaming (triage→extract→merge→reorganize). Off by default; enable with
  # docker compose --profile dream up -d. Shares /data with the main service;
  # only one distiller runs at a time (dream.lock mutual exclusion).
  dream:
    image: ruyi:latest
    profiles: ["dream"]
    volumes:
      - ~/ruyi-docker:/data
    restart: unless-stopped
    entrypoint: ["sh", "-c", "while true; do sleep 86400; node dist/cli.js distill || true; done"]
